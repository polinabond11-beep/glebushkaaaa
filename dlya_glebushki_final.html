<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Для Глебушки</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;color:#fff;font-family:Georgia,serif;background:radial-gradient(ellipse at 20% 20%,#38236b 0,transparent 38%),radial-gradient(ellipse at 80% 75%,#142d66 0,transparent 42%),linear-gradient(135deg,#07091f,#11102e 55%,#050817);display:grid;place-items:center}
#stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 10% 20%,#fff 98%,transparent),radial-gradient(1px 1px at 30% 80%,#fff 98%,transparent),radial-gradient(1.5px 1.5px at 70% 30%,#fff 98%,transparent),radial-gradient(2px 2px at 85% 65%,#fff 98%,transparent),radial-gradient(1px 1px at 55% 12%,#fff 98%,transparent);background-size:230px 190px;opacity:.8}
main{position:relative;z-index:1;width:min(92vw,620px);min-height:80vh;display:grid;place-items:center;text-align:center;padding:24px}
.scene{display:none;width:100%;animation:fade .8s ease both}.scene.active{display:block}@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1{font-weight:normal;font-size:clamp(25px,5vw,38px);text-shadow:0 0 18px #c5a8ff}
.envelope-wrap{margin:36px auto 18px;width:220px;height:150px;position:relative;cursor:pointer;filter:drop-shadow(0 12px 24px #0009);transition:transform .3s}.envelope-wrap:hover{transform:translateY(-6px) scale(1.03)}
.envelope{position:absolute;inset:30px 0 0;background:#e9b9cf;border-radius:5px;overflow:visible}
.envelope:before{content:"";position:absolute;inset:0;background:#f4d5e1;clip-path:polygon(0 0,50% 58%,100% 0);z-index:3;transform-origin:top;transition:transform .8s}
.envelope:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#d98eb1,#f0b8d0);clip-path:polygon(0 100%,50% 48%,100% 100%);z-index:4}
.flap{position:absolute;top:30px;left:0;width:0;height:0;border-left:110px solid transparent;border-right:110px solid transparent;border-top:76px solid #f8dfeb;z-index:5;transform-origin:top;transition:transform .8s}
.seal{position:absolute;z-index:6;left:50%;top:80px;transform:translate(-50%,-50%);font-size:27px}
.envelope-wrap.open .flap{transform:rotateX(180deg);z-index:1}.envelope-wrap.open .envelope:before{transform:rotateX(180deg)}
.tap{font:16px Arial,sans-serif;letter-spacing:4px;color:#e9dfff;text-transform:uppercase}
.letter{max-width:490px;margin:12px auto 0;padding:62px 34px 48px;position:relative;color:#56344e;font-size:clamp(19px,4vw,25px);line-height:1.7;letter-spacing:.15px;background:radial-gradient(ellipse at 50% 0%,#fffdf8 0,#fff5ed 55%,#f4dce8 100%);border:1px solid #f8d9e7;border-radius:48% 48% 18px 18px / 12% 12% 18px 18%;box-shadow:0 0 0 7px #f8ddea22,0 0 0 9px #e7b8d355,0 24px 65px #0009;transform:rotate(-1deg);isolation:isolate}
.letter:before{content:"";position:absolute;inset:13px;border:1px solid #d6a5bd;border-radius:46% 46% 12px 12px / 12% 12% 12px 12%;pointer-events:none}
.letter:after{content:"✦  ♡  ✦";position:absolute;top:19px;left:0;right:0;text-align:center;color:#c17b9e;font-size:19px;letter-spacing:9px;text-shadow:0 1px #fff}
/* Письмо проявляется мягко, словно появляется из конверта */
#letterScene.active .letter{opacity:0;animation:letterReveal 1.45s cubic-bezier(.2,.75,.25,1) .12s forwards}
#letterScene.active #next{opacity:0;animation:buttonReveal .8s ease 1.05s forwards}
@keyframes letterReveal{0%{opacity:0;transform:translateY(28px) scale(.94) rotate(-3deg);filter:blur(7px)}65%{opacity:1;filter:blur(0)}100%{opacity:1;transform:translateY(0) scale(1) rotate(-1deg);filter:blur(0)}}
@keyframes buttonReveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
button{border:1px solid #e9d7ff;background:#ffffff18;color:white;border-radius:999px;padding:13px 32px;font-size:16px;letter-spacing:1px;cursor:pointer;margin-top:28px;backdrop-filter:blur(8px);transition:.2s}button:hover{background:#ffffff35;transform:translateY(-2px)}
#galaxy{width:min(84vw,490px);height:min(84vw,490px);max-height:53vh;display:block;margin:0 auto;cursor:grab;touch-action:none;filter:drop-shadow(0 0 24px #8b6dff66)}#galaxy:active{cursor:grabbing}
.love{font-size:clamp(22px,4.5vw,32px);margin-top:18px;text-shadow:0 0 18px #c7a5ff}
.hint{font:13px Arial,sans-serif;color:#c9c1e8;margin-top:8px}
#finalReveal{display:none;width:min(78vw,430px);max-height:52vh;object-fit:contain;margin:12px auto 0;border-radius:22px;box-shadow:0 0 35px #ff9fc866,0 0 90px #b68cff55;opacity:0}
#finalReveal.show{display:block;animation:photoReveal 1.05s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes galaxyCollapse{0%{transform:scale(1);opacity:1;filter:brightness(1)}55%{transform:scale(.48) rotate(22deg);opacity:.75;filter:brightness(2.2)}100%{transform:scale(.015) rotate(160deg);opacity:0;filter:brightness(4)}}
#galaxy.implode{animation:galaxyCollapse .72s cubic-bezier(.6,0,.9,.4) forwards;pointer-events:none}
@keyframes photoReveal{0%{opacity:0;transform:scale(.45);filter:blur(12px)}65%{opacity:1;filter:blur(0)}100%{opacity:1;transform:scale(1);filter:blur(0)}}
#revealBtn{margin-top:18px;background:linear-gradient(135deg,#f3b5d5aa,#a98beaaa);border-color:#f7d8ff;box-shadow:0 0 22px #d49cff55}
#revealBtn:disabled{opacity:0;pointer-events:none}
</style>
</head>
<body><div id="stars"></div><main>
<section id="start" class="scene active">
<h1>Для тебя ✨</h1>
<div class="envelope-wrap" id="env" role="button" tabindex="0" aria-label="Открыть конверт">
<div class="envelope"></div><div class="flap"></div><div class="seal">♡</div>
</div><div class="tap">нажми</div>
</section>
<section id="letterScene" class="scene">
<div class="letter">глебушка, прости меня, я признаю свою вину. я хочу чтобы ты понял, что ты мне дорог, дай мне шанс все изменить</div>
<button id="next">дальше</button>
</section>
<section id="galaxyScene" class="scene">
<canvas id="galaxy" width="700" height="700" aria-label="Вращающаяся галактика"></canvas>
<div class="love" id="loveText">люблю тебя на всех языках мира</div>
<div class="hint" id="galaxyHint">Проведи пальцем или мышкой, чтобы повернуть галактику ✨</div>
<button id="revealBtn">нажми</button>

<script>
const scenes=[...document.querySelectorAll('.scene')];
function show(id){scenes.forEach(s=>s.classList.toggle('active',s.id===id))}
const env=document.getElementById('env');
function confettiBurst(){
 const canvas=document.createElement('canvas');
 canvas.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20';
 document.body.appendChild(canvas);
 const ctx=canvas.getContext('2d'),dpr=Math.min(window.devicePixelRatio||1,2);
 canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;ctx.scale(dpr,dpr);
 const colors=['#ffd6e7','#fff1a8','#c9b5ff','#a8e8ff','#ff9fc8','#ffffff'];
 const pieces=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*100,y:innerHeight*.42,vx:(Math.random()-.5)*12,vy:-Math.random()*11-3,gravity:.22+Math.random()*.12,rotation:Math.random()*Math.PI,spin:(Math.random()-.5)*.2,w:5+Math.random()*6,h:7+Math.random()*9,color:colors[Math.floor(Math.random()*colors.length)],life:100+Math.random()*35}));
 let frame=0;
 function animate(){ctx.clearRect(0,0,innerWidth,innerHeight);pieces.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=q.gravity;q.vx*=.992;q.rotation+=q.spin;q.life--;ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.rotation);ctx.globalAlpha=Math.max(0,Math.min(1,q.life/35));ctx.fillStyle=q.color;ctx.fillRect(-q.w/2,-q.h/2,q.w,q.h);ctx.restore()});frame++;if(frame<145)requestAnimationFrame(animate);else canvas.remove()}
 animate();
}
function openLetter(){env.classList.add('open');confettiBurst();setTimeout(()=>show('letterScene'),650)}
env.addEventListener('click',openLetter);env.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openLetter()}});
document.getElementById('next').addEventListener('click',()=>{show('galaxyScene');draw()});
document.getElementById('revealBtn').addEventListener('click',()=>{
 const btn=document.getElementById('revealBtn');
 if(btn.disabled)return;
 btn.disabled=true;
 c.classList.add('implode');
 document.getElementById('loveText').style.transition='opacity .35s ease';
 document.getElementById('galaxyHint').style.transition='opacity .35s ease';
 document.getElementById('loveText').style.opacity='0';
 document.getElementById('galaxyHint').style.opacity='0';
 cancelAnimationFrame(anim);
 setTimeout(()=>{
   c.style.display='none';
   document.getElementById('loveText').style.display='none';
   document.getElementById('galaxyHint').style.display='none';
   btn.style.display='none';
   document.getElementById('finalReveal').classList.add('show');
 },720);
});
const c=document.getElementById('galaxy'),ctx=c.getContext('2d');let angle=0,drag=false,lastX=0,lastY=0,tilt=.42,anim;
// Частицы создаются один раз, поэтому галактика выглядит цельной и не мерцает.
const dust=Array.from({length:1900},()=>{let arm=Math.floor(Math.random()*5),t=Math.pow(Math.random(),.72),r=18+t*265;return {arm,t,r,offset:(Math.random()-.5)*.58,size:.45+Math.random()*2.1,alpha:.25+Math.random()*.72,hue:245+Math.random()*95}});
const field=Array.from({length:230},()=>({x:Math.random()*700,y:Math.random()*700,r:.35+Math.random()*1.45,a:.25+Math.random()*.7,phase:Math.random()*6.28}));
// Маленькие сердечки парят по орбите вокруг галактики.
const hearts=Array.from({length:11},(_,i)=>({a:i*Math.PI*2/11+.18,r:276+(i%3)*13,size:5+(i%4)*1.6,phase:i*1.7,hue: i%2 ? 326 : 285}));
function paint(){const w=c.width,h=c.height,cx=w/2,cy=h/2;ctx.clearRect(0,0,w,h);
 // глубокий космический ореол
 let halo=ctx.createRadialGradient(cx,cy,8,cx,cy,330);halo.addColorStop(0,'#fff4fa');halo.addColorStop(.035,'#ffd6f5');halo.addColorStop(.12,'#c6a0ff88');halo.addColorStop(.38,'#7554d533');halo.addColorStop(1,'transparent');ctx.fillStyle=halo;ctx.fillRect(0,0,w,h);
 // звёздное поле
 field.forEach(s=>{ctx.globalAlpha=s.a*(.72+.28*Math.sin(s.phase+angle*3));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;
 // спиральные рукава с пылью и сиянием
 dust.forEach(p=>{let a=p.t*10.8+angle+p.arm*Math.PI*2/5+p.offset;let x=cx+Math.cos(a)*p.r;let y=cy+Math.sin(a)*p.r*Math.sin(tilt);let fade=.35+.65*p.t;ctx.globalAlpha=p.alpha*fade;ctx.fillStyle=`hsla(${p.hue},${72-p.t*15}%,${72+p.t*18}%,1)`;ctx.beginPath();ctx.arc(x,y,p.size*(.7+.4*p.t),0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;
 // светящиеся дуги вокруг ядра
 ctx.save();ctx.translate(cx,cy);ctx.scale(1,Math.sin(tilt));ctx.rotate(angle*.18);for(let j=0;j<3;j++){ctx.beginPath();ctx.ellipse(0,0,105+j*24,42+j*10,-.22,0,Math.PI*2);ctx.strokeStyle=`rgba(210,177,255,${.12-j*.025})`;ctx.lineWidth=2+j*.7;ctx.stroke()}ctx.restore();
 // яркое ядро
 let core=ctx.createRadialGradient(cx,cy,1,cx,cy,82);core.addColorStop(0,'#ffffff');core.addColorStop(.06,'#fff2fa');core.addColorStop(.17,'#ffd5f1cc');core.addColorStop(.42,'#c69aff55');core.addColorStop(1,'transparent');ctx.fillStyle=core;ctx.beginPath();ctx.arc(cx,cy,84,0,Math.PI*2);ctx.fill();
 // мягкие лучи
 ctx.save();ctx.translate(cx,cy);ctx.rotate(-angle*.25);for(let i=0;i<12;i++){ctx.rotate(Math.PI/6);let ray=ctx.createLinearGradient(0,0,0,245);ray.addColorStop(0,'rgba(255,224,255,.18)');ray.addColorStop(1,'rgba(180,150,255,0)');ctx.fillStyle=ray;ctx.beginPath();ctx.moveTo(-2,0);ctx.lineTo(-9,245);ctx.lineTo(9,245);ctx.closePath();ctx.fill()}ctx.restore();
 // сияющие сердечки на внешней орбите
 hearts.forEach(h=>{const a=h.a+angle*.32+Math.sin(angle*2+h.phase)*.035;const x=cx+Math.cos(a)*h.r;const y=cy+Math.sin(a)*h.r*.88;const pulse=.82+.18*Math.sin(angle*3+h.phase);ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(angle+h.phase)*.16);ctx.scale(h.size/10*pulse,h.size/10*pulse);ctx.shadowColor=`hsla(${h.hue},100%,78%,.95)`;ctx.shadowBlur=19;ctx.fillStyle=`hsla(${h.hue},100%,83%,.95)`;ctx.beginPath();ctx.moveTo(0,9);ctx.bezierCurveTo(-18,-2,-12,-15,0,-7);ctx.bezierCurveTo(12,-15,18,-2,0,9);ctx.fill();ctx.restore()});
}
function draw(){cancelAnimationFrame(anim);function loop(){if(!drag){angle+=.0028;paint();anim=requestAnimationFrame(loop)}}paint();if(!drag)anim=requestAnimationFrame(loop)}
function point(e){const r=c.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
c.addEventListener('pointerdown',e=>{drag=true;lastX=point(e).x;lastY=point(e).y;c.setPointerCapture(e.pointerId);cancelAnimationFrame(anim)});
c.addEventListener('pointermove',e=>{if(!drag)return;let p=point(e);angle+=(p.x-lastX)*.008;tilt=Math.max(.12,Math.min(1.1,tilt+(p.y-lastY)*.004));lastX=p.x;lastY=p.y;paint()});
c.addEventListener('pointerup',()=>{if(drag){drag=false;draw()}});c.addEventListener('pointercancel',()=>{drag=false;draw()});
</script></body></html>
